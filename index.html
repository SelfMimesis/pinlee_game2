<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pinlee Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="game" class="game">
      <div class="background" aria-hidden="true">
        <div class="parallax-layer sky-layer"></div>
        <div class="parallax-layer buildings-layer"></div>
        <div class="parallax-layer ground-layer"></div>
      </div>

      <div id="playArea" class="play-area" aria-label="Zona de juego">
        <div id="player" class="player" aria-hidden="true">
          <div class="player-shadow"></div>
          <div class="player-head"></div>
          <div class="player-body"></div>
          <div class="player-arm"></div>
          <div class="player-gun"></div>
          <div id="muzzle" class="muzzle"></div>
          <div class="muzzle-flash"></div>
          <div class="player-leg player-leg-left"></div>
          <div class="player-leg player-leg-right"></div>
        </div>
      </div>

      <header class="hud">
        <div class="stats">
          <div class="stat">
            <span>Puntos</span>
            <strong id="score">0</strong>
          </div>

          <div class="stat">
            <span>Fallos</span>
            <strong><span id="misses">0</span>/5</strong>
          </div>
        </div>

        <button id="restartButton" class="restart-button" type="button">Reiniciar</button>
      </header>

      <section id="gameOver" class="game-over" hidden>
        <h1>Partida terminada</h1>
        <p>Puntuacion final: <strong id="finalScore">0</strong></p>
        <button id="gameOverRestartButton" class="restart-button" type="button">Jugar otra vez</button>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
