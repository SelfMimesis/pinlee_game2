<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pinlee Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="game" class="game">
      <div class="background" aria-hidden="true">
        <div class="parallax-layer city-layer city-layer-1">
          <div class="city-track">
            <img src="assets/backgrounds/cyberpunk/layer-1-strip.png" alt="" />
            <img src="assets/backgrounds/cyberpunk/layer-1-strip.png" alt="" />
          </div>
        </div>
        <div class="parallax-layer city-layer city-layer-3">
          <div class="city-track">
            <img src="assets/backgrounds/cyberpunk/layer-3-strip.png" alt="" />
            <img src="assets/backgrounds/cyberpunk/layer-3-strip.png" alt="" />
          </div>
        </div>
        <div class="parallax-layer city-layer city-layer-4">
          <div class="city-track">
            <img src="assets/backgrounds/cyberpunk/layer-4-strip.png" alt="" />
            <img src="assets/backgrounds/cyberpunk/layer-4-strip.png" alt="" />
          </div>
        </div>
        <div class="parallax-layer city-layer city-layer-5">
          <div class="city-track">
            <img src="assets/backgrounds/cyberpunk/layer-5-strip.png" alt="" />
            <img src="assets/backgrounds/cyberpunk/layer-5-strip.png" alt="" />
          </div>
        </div>
        <div class="tile-floor"></div>
      </div>

      <div id="playArea" class="play-area" aria-label="Zona de juego">
        <div id="player" class="player" data-state="idle" aria-hidden="true">
          <span class="player-sprite"></span>
          <span class="player-charge"></span>
        </div>
      </div>

      <img
        class="interface-overlay"
        src="assets/ui/news-interface-presaux2.png"
        alt=""
        aria-hidden="true"
      />

      <header class="hud">
        <div class="stats">
          <div class="stat">
            <span>Puntos</span>
            <strong id="score">0</strong>
          </div>

          <div class="stat">
            <span>Vidas</span>
            <strong><span id="lives">5</span>/5</strong>
          </div>
        </div>

        <button id="restartButton" class="restart-button" type="button">Reiniciar</button>
      </header>

      <section id="gameOver" class="game-over" hidden>
        <h1>Partida terminada</h1>
        <p>Puntuacion final: <strong id="finalScore">0</strong></p>
        <button id="gameOverRestartButton" class="restart-button" type="button">Jugar otra vez</button>
      </section>

      <section
        id="remotePopup"
        class="remote-popup"
        role="dialog"
        aria-modal="true"
        aria-labelledby="remotePopupMessage"
        hidden
      >
        <div class="remote-popup__panel">
          <p id="remotePopupMessage"></p>
          <button id="remotePopupClose" class="restart-button remote-popup__close" type="button">
            Cerrar
          </button>
        </div>
      </section>
    </main>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="game.js"></script>
  </body>
</html>
