<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pinlee Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="game" class="game">
      <div class="background" aria-hidden="true">
        <div class="parallax-layer city-layer city-layer-1">
          <div class="city-track">
            <img src="assets/backgrounds/cyberpunk/layer-1-strip.png" alt="" />
            <img src="assets/backgrounds/cyberpunk/layer-1-strip.png" alt="" />
          </div>
        </div>
        <div class="parallax-layer city-layer city-layer-3">
          <div class="city-track">
            <img src="assets/backgrounds/cyberpunk/layer-3-strip.png" alt="" />
            <img src="assets/backgrounds/cyberpunk/layer-3-strip.png" alt="" />
          </div>
        </div>
        <div class="parallax-layer city-layer city-layer-5">
          <div class="city-track">
            <img src="assets/backgrounds/cyberpunk/layer-5-strip.png" alt="" />
            <img src="assets/backgrounds/cyberpunk/layer-5-strip.png" alt="" />
          </div>
        </div>
      </div>

      <div id="playArea" class="play-area" aria-label="Zona de juego">
        <div id="player" class="player" data-animation="idle" aria-hidden="true">
          <div class="player-sprite"></div>
          <div id="muzzle" class="muzzle"></div>
          <div class="muzzle-flash"></div>
        </div>
      </div>

      <img
        class="interface-overlay"
        src="assets/ui/news-interface-presaux.png"
        alt=""
        aria-hidden="true"
      />

      <header class="hud">
        <div class="stats">
          <div class="stat">
            <span>Puntos</span>
            <strong id="score">0</strong>
          </div>

          <div class="stat">
            <span>Fallos</span>
            <strong><span id="misses">0</span>/5</strong>
          </div>
        </div>

        <button id="restartButton" class="restart-button" type="button">Reiniciar</button>
      </header>

      <section id="gameOver" class="game-over" hidden>
        <h1>Partida terminada</h1>
        <p>Puntuacion final: <strong id="finalScore">0</strong></p>
        <button id="gameOverRestartButton" class="restart-button" type="button">Jugar otra vez</button>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
